<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuraScope — First administrator setup</title><link rel="stylesheet" href="/app.css"></head>
<body><main class="wrap"><header><a class="logo" href="/">Mura<b>Scope</b></a></header><section class="card"><h1>First administrator setup</h1><p>Use this page once to create the first MuraScope administrator. The setup token must match the Cloudflare secret.</p>
<form id="setup"><label>Name<input name="name" required minlength="2" maxlength="30" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password (at least 12 characters)<input name="password" type="password" required minlength="12" autocomplete="new-password"></label><label>Setup token<input name="setup_token" type="password" required autocomplete="off"></label><button class="btn" type="submit">Create administrator</button></form><p id="status" role="status"></p></section></main>
<script>
document.getElementById("setup").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f.entries()),s=document.getElementById("status");s.textContent="Creating administrator…";try{const r=await fetch("/api/admin/setup",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Setup failed");s.textContent="Administrator created. You are signed in. Open the admin page.";e.target.reset();}catch(err){s.textContent=err.message;}});
</script></body></html>
